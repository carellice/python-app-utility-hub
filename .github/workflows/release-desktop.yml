name: Crea release desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag della release, ad esempio v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            artifact: windows-x64
          - label: macOS Intel
            os: macos-13
            artifact: macos-x64
          - label: macOS Apple Silicon
            os: macos-14
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      # Tutti i segreti sono opzionali: senza certificati la pipeline produce
      # comunque gli installer, ma Windows/macOS potrebbero mostrare un avviso.
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
      MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installa le dipendenze di build
        run: python -m pip install --upgrade pip -r requirements-build.txt

      - name: Prepara FFmpeg e FFprobe inclusi
        run: python packaging/fetch_ffmpeg.py --output packaging/vendor

      - name: Prepara il certificato Apple
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_BASE64 != ''
        shell: bash
        run: |
          certificate_path="$RUNNER_TEMP/macos-certificate.p12"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$MACOS_CERTIFICATE_PASSWORD" "$keychain_path"

      - name: Crea il bundle senza Python esterno
        shell: bash
        run: |
          arguments=(--output release/app)
          if [[ -n "${MACOS_CODESIGN_IDENTITY:-}" ]]; then
            arguments+=(--codesign-identity "$MACOS_CODESIGN_IDENTITY")
          fi
          python packaging/build.py "${arguments[@]}"

      - name: Firma l'app Windows
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE_BASE64 != '' && env.WINDOWS_CERTIFICATE_PASSWORD != ''
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'windows-certificate.pfx'
          [System.IO.File]::WriteAllBytes($certificatePath, [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $application = '.\release\app\Python App Utility Hub\Python App Utility Hub.exe'
          & signtool.exe sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PASSWORD $application
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verifica il contenuto del bundle Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python packaging/verify_bundle.py --bundle "release/app/Python App Utility Hub"

      - name: Crea l'installer Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          $version = $env:RELEASE_TAG -replace '^v', ''
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" packaging\windows-installer.iss

      - name: Firma l'installer Windows
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE_BASE64 != '' && env.WINDOWS_CERTIFICATE_PASSWORD != ''
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'windows-certificate.pfx'
          Get-ChildItem '.\release\installers' -Filter '*.exe' | ForEach-Object {
            & signtool.exe sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PASSWORD $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Verifica il contenuto del bundle macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python packaging/verify_bundle.py --bundle "release/app/Python App Utility Hub.app"
          codesign --verify --deep --strict "release/app/Python App Utility Hub.app"

      - name: Crea l'installer macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          if [[ "$(uname -m)" == "arm64" ]]; then architecture="arm64"; else architecture="x64"; fi
          chmod +x packaging/macos-installer.sh
          packaging/macos-installer.sh "$version" "$architecture" "release/app/Python App Utility Hub.app" release/installers

      - name: Firma e notarizza l'installer macOS
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_BASE64 != '' && env.MACOS_CODESIGN_IDENTITY != '' && env.MACOS_INSTALLER_IDENTITY != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != ''
        shell: bash
        run: |
          package_path="$(find release/installers -name '*.pkg' -print -quit)"
          signed_package="${package_path%.pkg}-signed.pkg"
          productsign --sign "$MACOS_INSTALLER_IDENTITY" "$package_path" "$signed_package"
          mv "$signed_package" "$package_path"
          xcrun notarytool submit "$package_path" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
          xcrun stapler staple "$package_path"

      - name: Carica l'installer creato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/installers/*
          if-no-files-found: error

  publish:
    name: Pubblica la release GitHub
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Crea o aggiorna la release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-artifacts/* --clobber
          else
            gh release create "$RELEASE_TAG" release-artifacts/* --generate-notes --title "Python App Utility Hub $RELEASE_TAG"
          fi
